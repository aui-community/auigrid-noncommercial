<!-- AUIGrid 테마 CSS 파일입니다. 그리드 출력을 위해 꼭 삽입하십시오. -->

<!-- AUIGrid 라이센스 파일입니다. 그리드 출력을 위해 꼭 삽입하십시오. -->
<script type="text/javascript" src="../AUIGrid/AUIGridLicense.js"></script>

<!-- AUIGrid 컴포넌트 JS 파일입니다. 그리드 출력을 위해 꼭 삽입하십시오.--> 
<script type="text/javascript" src="../AUIGrid/AUIGrid.js"></script>

        <!-- 제품 테마는 유지하고 업무 화면의 조작 도구만 별도로 구성합니다. -->
        <link href="./style/showcase-workspaces.css?v=20261006-3" rel="stylesheet" />
        <script src="../pdfkit/AUIGrid.pdfkit.js"></script>
        <script src="../export_server_samples/FileSaver.min.js"></script>
        <script>
            let myGridID;
            let selectedProduct = "P01";
            const numberFormat = new Intl.NumberFormat("ko-KR");
            const supplyStates = ["확보", "협의 중", "대체 검토"];
            const modules = [
                {
                    name: "구동 모듈",
                    parts: [
                        ["구동 모터", 185000, 2],
                        ["감속기", 96000, 2],
                        ["구동 휠", 42000, 4],
                        ["브레이크", 58000, 2]
                    ]
                },
                {
                    name: "전원 모듈",
                    parts: [
                        ["배터리 팩", 420000, 1],
                        ["BMS 보드", 78000, 1],
                        ["충전 커넥터", 28000, 2],
                        ["전원 하네스", 19000, 3]
                    ]
                },
                {
                    name: "제어 모듈",
                    parts: [
                        ["산업용 컴퓨터", 680000, 1],
                        ["모터 드라이버", 125000, 2],
                        ["통신 모듈", 86000, 1],
                        ["비상 정지 스위치", 17000, 2]
                    ]
                },
                {
                    name: "센서 모듈",
                    parts: [
                        ["2D LiDAR", 540000, 1],
                        ["깊이 카메라", 210000, 2],
                        ["초음파 센서", 22000, 4],
                        ["범퍼 센서", 35000, 2]
                    ]
                }
            ];
            // 제품 20개, 조립체 80개, 실제 부품 행 320개를 포함하는 420행의 BOM을 생성합니다.
            function createProducts() {
                return Array.from({ length: 20 }, (_, productIndex) => {
                    const id = "P" + String(productIndex + 1).padStart(2, "0");
                    return {
                        id,
                        productId: id,
                        nodeType: "product",
                        name:
                            "AMR-" +
                            (100 + productIndex * 10) +
                            " / " +
                            ["물류 이송형", "협동 작업형", "클린룸 운반형", "중량 운반형"][productIndex % 4],
                        quantity: 1,
                        children: modules.map((module, moduleIndex) => ({
                            id: id + "-M" + moduleIndex,
                            productId: id,
                            nodeType: "assembly",
                            name: module.name,
                            quantity: moduleIndex === 3 && productIndex % 3 === 0 ? 2 : 1,
                            children: module.parts.map(([name, price, quantity], partIndex) => ({
                                id: id + "-M" + moduleIndex + "-C" + partIndex,
                                productId: id,
                                nodeType: "part",
                                name,
                                quantity,
                                unitCost: Math.round((price * (1 + productIndex * 0.012)) / 100) * 100,
                                supplier: ["에이원 모션", "이음 파워", "노바 컨트롤", "루트 센서"][
                                    (moduleIndex + partIndex) % 4
                                ],
                                leadDays: 5 + ((productIndex + partIndex * 3 + moduleIndex * 2) % 18),
                                supply: supplyStates[
                                    (productIndex + moduleIndex + partIndex) % 9 === 0
                                        ? 2
                                        : (productIndex + partIndex) % 5 === 0
                                          ? 1
                                          : 0
                                ]
                            }))
                        }))
                    };
                });
            }
            // 부품의 금액을 먼저 구한 뒤, 조립체의 투입 수량을 곱해 제품 원가를 위로 합산합니다.
            function rollup(node, updates = []) {
                if (node.children) {
                    node.children.forEach((child) => rollup(child, updates));
                    node.unitCost = node.children.reduce((sum, child) => sum + child.total, 0);
                    node.leadDays = Math.max(...node.children.map((child) => child.leadDays));
                    node.supply =
                        supplyStates[Math.max(...node.children.map((child) => supplyStates.indexOf(child.supply)))];
                }
                node.total = node.quantity * node.unitCost;
                updates.push({
                    id: node.id,
                    unitCost: node.unitCost,
                    total: node.total,
                    leadDays: node.leadDays,
                    supply: node.supply
                });
                return node;
            }
            function init() {
                const numberColumn = (field, title, width) => ({
                    dataField: field,
                    headerText: title,
                    width,
                    minWidth: field === "quantity" ? 70 : 110,
                    dataType: "numeric",
                    formatString: "#,##0",
                    style: "workspace-number",
                    styleFunction: (row, col, value, header, item) =>
                        field !== "total" &&
                        (field === "quantity" ? item.nodeType !== "product" : item.nodeType === "part")
                            ? "bom-edit"
                            : "workspace-number",
                    editable: field !== "total",
                    editRenderer: {
                        type: "InputEditRenderer",
                        onlyNumeric: true,
                        allowPoint: false,
                        validator: validateCost
                    }
                });
                myGridID = AUIGrid.create(
                    "#grid_wrap",
                    [
                        {
                            dataField: "name",
                            headerText: "제품 / 조립체 / 부품",
                            width: "31%",
                            minWidth: 290,
                            style: "workspace-left",
                            editable: false
                        },
                        {
                            headerText: "조달 정보",
                            children: [
                                {
                                    dataField: "supplier",
                                    headerText: "공급사",
                                    width: "14%",
                                    minWidth: 115,
                                    editable: false
                                },
                                {
                                    dataField: "leadDays",
                                    headerText: "납기(일)",
                                    width: "8%",
                                    minWidth: 75,
                                    dataType: "numeric",
                                    editable: false
                                },
                                {
                                    dataField: "supply",
                                    headerText: "수급 상태",
                                    width: "11%",
                                    minWidth: 100,
                                    editable: false,
                                    styleFunction: (row, col, value) =>
                                        value === "대체 검토"
                                            ? "bom-review"
                                            : value === "협의 중"
                                              ? "bom-negotiate"
                                              : ""
                                }
                            ]
                        },
                        {
                            headerText: "원가 시뮬레이션 (원)",
                            children: [
                                numberColumn("quantity", "투입 수량", "8%"),
                                numberColumn("unitCost", "단가", "13%"),
                                numberColumn("total", "금액", "15%")
                            ]
                        }
                    ],
                    {
                        rowIdField: "id",
                        rowIdTrustMode: true,
                        editable: true,
                        rowHeight: 29,
                        headerHeight: 28,
                        showRowNumColumn: true,
                        showStateColumn: false,
                        selectionMode: "singleRow",
                        displayTreeOpen: true,
                        treeColumnIndex: 0,
                        rowStyleFunction: (row, item) =>
                            item.nodeType === "product"
                                ? "bom-product-row"
                                : item.nodeType === "assembly"
                                  ? "bom-assembly-row"
                                  : ""
                    }
                );
                // 집계 단가와 제품 수량은 읽기 전용이며 실제 편집 대상만 입력기를 엽니다.
                AUIGrid.bind(myGridID, "cellEditBegin", (event) =>
                    event.dataField === "quantity"
                        ? event.item.nodeType !== "product"
                        : event.dataField === "unitCost" && event.item.nodeType === "part"
                );
                AUIGrid.bind(myGridID, "cellEditEnd", () =>
                    queueMicrotask(() => {
                        if (myGridID) recalculate();
                    })
                );
                AUIGrid.bind(myGridID, "selectionChange", (event) => {
                    selectedProduct = event.primeCell.item.productId;
                    updateProductSummary();
                });
                AUIGrid.bind(myGridID, "treeOpenChange", () =>
                    queueMicrotask(() => {
                        if (myGridID) updateProductSummary();
                    })
                );
                // 붙여넣기 경로에서도 읽기 전용 집계 필드를 원래 값으로 유지합니다.
                AUIGrid.bind(myGridID, "cellEditEndBefore", (event) => {
                    const editable =
                        event.dataField === "quantity"
                            ? event.item.nodeType !== "product"
                            : event.dataField === "unitCost" && event.item.nodeType === "part";
                    return editable ? event.value : event.oldValue;
                });
                resetCosts();
            }
            function validateCost(old, value, item, field) {
                const count = Number(value),
                    minimum = field === "quantity" ? 1 : 0,
                    maximum = field === "quantity" ? 999 : 100000000;
                return {
                    validate:
                        String(value).trim() !== "" && Number.isInteger(count) && count >= minimum && count <= maximum,
                    message:
                        field === "quantity"
                            ? "투입 수량은 1~999 사이의 정수입니다."
                            : "단가는 0~100,000,000원 사이의 정수입니다."
                };
            }
            function recalculate() {
                const updates = [];
                AUIGrid.getTreeGridData(myGridID).forEach((node) => rollup(node, updates));
                // 트리의 접힘, 정렬 및 선택 상태를 보존하고 계산 필드만 ID로 갱신합니다.
                AUIGrid.refreshRows(myGridID, updates);
                updateProductSummary();
            }
            function updateProductSummary() {
                const product = AUIGrid.getTreeGridData(myGridID).find((item) => item.id === selectedProduct);
                if (!product) return;
                document.getElementById("bom-product").textContent = product.name;
                document.getElementById("bom-cost").textContent = numberFormat.format(product.total) + "원";
                document.getElementById("bom-lead").textContent =
                    "최장 부품 납기 " + product.leadDays + "일 / " + product.supply;
                document.getElementById("bom-visible").textContent =
                    "표시 " + AUIGrid.getRowCount(myGridID) + "행 / 전체 420행";
            }
            function showDepth(value) {
                if (value === "all") AUIGrid.expandAll(myGridID);
                else AUIGrid.showItemsOnDepth(myGridID, Number(value));
                updateProductSummary();
            }
            function resetCosts() {
                AUIGrid.forceEditingComplete(myGridID, null);
                const data = createProducts();
                data.forEach((node) => rollup(node));
                AUIGrid.setGridData(myGridID, data);
                selectedProduct = "P01";
                document.getElementById("bom-depth").value = "all";
                AUIGrid.expandAll(myGridID);
                AUIGrid.setSelectionByIndex(myGridID, 0, 0);
                updateProductSummary();
            }
            function exportReport(format) {
                AUIGrid.forceEditingComplete(myGridID, null);
                recalculate();
                const props = { fileName: "자율주행로봇_BOM_원가" };
                if (format === "pdf")
                    AUIGrid.exportToPdf(myGridID, { ...props, fontPath: "../pdfkit/nyjgothic-medium.ttf" });
                else AUIGrid.exportToXlsx(myGridID, props);
            }
            function disposeDemo(event) {
                if (event.persisted) return;
                AUIGrid.destroy(myGridID);
                myGridID = null;
                window.removeEventListener("pagehide", disposeDemo);
            }
            window.addEventListener("pagehide", disposeDemo);
        </script>
    </head>
<body class="demo-typography">

            <div id="main" class="workspace-demo bom-workspace">
                <div class="workspace-heading">
                    <div>
                        <h2>자율주행 로봇 BOM 원가 시뮬레이터</h2>
                        <p>제품 20개, 조립체 80개, 부품 320개. 부품 단가와 투입 수량을 바꾸며 원가를 검토하세요.</p>
                    </div>
                </div>
                <div class="bom-summary">
                    <div>
                        <span>선택 제품 / 1대 기준</span>
                        <h3 id="bom-product"></h3>
                        <small id="bom-lead"></small>
                    </div>
                    <div class="bom-total"><span>자재 원가</span><strong id="bom-cost"></strong></div>
                </div>
                <div class="workspace-toolbar">
                    <div class="workspace-controls">
                        <label
                            >구성 보기<select id="bom-depth" onchange="showDepth(this.value)">
                                <option value="all">부품까지</option>
                                <option value="2">조립체까지</option>
                                <option value="1">제품만</option>
                            </select></label
                        ><span id="bom-visible"></span
                        ><button type="button" class="btn" onclick="resetCosts()">입력 초기화</button>
                    </div>
                    <div class="workspace-controls">
                        <button type="button" class="btn" onclick="exportReport('xlsx')">Excel 내보내기</button
                        ><button type="button" class="btn" onclick="exportReport('pdf')">PDF 내보내기</button>
                    </div>
                </div>
                <div id="grid_wrap"></div>
                <div class="workspace-note">
                    <p>파란 수량과 단가를 더블클릭하거나 F2로 편집하세요. 상위 금액은 자동 합산됩니다.</p>
                    <p>가상 BOM / 부품 비용만 반영, 가공비 및 세금 제외</p>
                </div>
            </div>
<div id="footer">
