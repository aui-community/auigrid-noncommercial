<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge"/>
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1"> 
<meta name="og:title" content="HTML5, 자바스크립트 데이터그리드 AUIGrid">
<meta name="og:url" content="https://www.auisoft.net/">
<meta name="og:description" content="HTML5, 자바스크립트 데이타그리드(javascript datagrid) AUISoft">
<title>AUIGrid v3.0 샘플- HTML5, 자바스크립트 데이터그리드 AUIGrid</title>
<link href="https://www.auisoft.net/aui.ico" rel="shortcut icon" />

<!-- 데모 구성용 CSS 입니다. 실제 프로젝트에서는 불필요 하니 추가할 필요 없습니다. -->
<link href="./demo.css" rel="stylesheet">

<!-- 데모용 공용 스크립트입니다. 여기에 공통적인 스크립트가 존재합니다. 실제 프로젝트에서는 불필요 하니 추가할 필요 없습니다. -->
<script type="text/javascript" src="./common.js"></script>

<!-- AUIGrid 테마 CSS 파일입니다. 그리드 출력을 위해 꼭 삽입하십시오. -->
<!-- 원하는 테마가 있다면, 다른 파일로 교체 하십시오. -->
<link href="../AUIGrid/AUIGrid_style.css" rel="stylesheet">

<!-- AUIGrid 라이센스 파일입니다. 그리드 출력을 위해 꼭 삽입하십시오. -->
<script type="text/javascript" src="../AUIGrid/AUIGridLicense.js"></script>

<!-- AUIGrid 컴포넌트 JS 파일입니다. 그리드 출력을 위해 꼭 삽입하십시오.--> 
<script type="text/javascript" src="../AUIGrid/AUIGrid.js"></script>

<script>
    // 이 예제: enableDropTreeChild: true이면 다른 행의 마지막 자식으로 이동할 수 있습니다.
    // init에서 그리드를 생성합니다. 칼럼 정의, 설정, 데이터 입력과 버튼 동작은 이 페이지에 있습니다.
    // AUIGrid 생성 후 반환 ID
    let myGridID;
    // 시작점
    function init() {
        // AUIGrid 그리드를 생성합니다.
        createAUIGrid();
        // 데이터 요청, 요청 성공 시 AUIGrid 에 데이터 삽입합니다.
        loadGridData();
    }
    // AUIGrid 를 생성합니다.
    function createAUIGrid() {
        // 그리드 칼럼 레이아웃 설정
        const columnLayout = [
            {
                dataField: "id",
                headerText: "ID",
                width: 80
            }, {
                dataField: "name",
                headerText: "Task Name",
                width: 400
            }, {
                dataField: "charge",
                headerText: "Charge",
                width: 140
            }, {
                dataField: "complete",
                headerText: "Complete(%)",
                postfix: "%",
                width: 120
            }, {
                dataField: "start",
                headerText: "Start Date"
            }, {
                dataField: "end",
                headerText: "End Date"
            }
        ];
        // 그리드 속성 설정
        const gridProps = {
            selectionMode: "singleRow",
            rowIdField: "id",
            displayTreeOpen: true,
            //rowHeight: 34,
            treeColumnIndex: 1,
            // 드래깅 행 이동 가능 여부 (기본값 : false)
            enableDrag: true,
            // 드랍 가능 여부 (기본값 : true)
            enableDrop: true,
            // 셀에서 바로  드래깅 해 이동 가능 여부 (기본값 : false) - enableDrag=true 설정이 선행
            enableDragByCellDrag: true,
            // 트리그리드에서 자식으로 드랍 가능 여부 (기본값 : false)
            enableDropTreeChild: true,
            editable: true
        };
        // 실제로 #grid_wrap 에 그리드 생성
        myGridID = AUIGrid.create("#grid_wrap", columnLayout, gridProps);
        // 드래깅 시작 이벤트 바인딩
        AUIGrid.bind(myGridID, "dragBegin", function (e) {
            if (e.items.length === 0)
                return;
            const item = e.items[0];
            // 정보 출력
            document.getElementById("elapse_b").textContent = `드래깅 시작 : ${item.id}, ${item.name}`;
        });
        // 드랍 종료 이벤트 바인딩
        AUIGrid.bind(myGridID, "dropEnd", function (e) {
            const direction = e.direction === true ? "위에서 아래로" : "아래에서 위로";
            const msg = `드랍 완료 : ${e.fromRowIndex} → ${e.toRowIndex} 에 ${e.items.length} 행(들) 드랍 됨( 진행 방향 : ${direction} )`;
            document.getElementById("elapse_e").textContent = `${msg}, isDropAsChild : ${e.isDropAsChild}`;
        });
    }
    // 여러 데모가 같은 JSON 자료를 사용합니다. 실제 서비스에서는 이 주소를 데이터 API로 바꾸세요.
    // 응답을 받은 뒤 setGridData에 전달하는 과정까지 이 HTML에서 확인할 수 있습니다.
    async function loadGridData() {
        AUIGrid.showAjaxLoader(myGridID);
        try {
            const response = await fetch("./data/schedule_tree.json");
            if (!response.ok)
                throw new Error("데이터를 불러오지 못했습니다.");
            const data = await response.json();
            AUIGrid.setGridData(myGridID, data);
        }
        catch (error) {
            document.getElementById("elapse").textContent = error.message;
        }
        finally {
            AUIGrid.removeAjaxLoader(myGridID);
        }
    }
</script>
</head>
<body>

<div id="main">
	<div class="desc">
		<p><code>enableDropTreeChild: true</code>이면 다른 행의 마지막 자식으로 이동할 수 있습니다.</p>
		<p>행 사이의 선은 앞뒤 이동, 행 위의 표시는 자식으로 이동할 위치를 뜻합니다.</p>

	</div>
	<div>
		<!-- 에이유아이 그리드가 이곳에 생성됩니다. -->
		<div id="grid_wrap" style="width:100%;height:480px; margin:0 auto;"></div>
	</div>
	<div class="desc_bottom">
		<p id="elapse_b"></p>
		<p id="elapse_e"></p>
	</div>
        <p id="elapse" role="status"></p>
</div>
<div id="footer">
     <div class="copyright">
        <p>Copyright © AUISoft Co., Ltd. https://www.auisoft.net</p>
    </div>
</div>
</body>
</html>
