<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge"/>
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1"> 
<meta name="og:title" content="HTML5, 자바스크립트 데이터그리드 AUIGrid">
<meta name="og:url" content="https://www.auisoft.net/">
<meta name="og:description" content="HTML5, 자바스크립트 데이타그리드(javascript datagrid) AUISoft">
<title>AUIGrid v3.0 샘플- HTML5, 자바스크립트 데이터그리드 AUIGrid</title>
<link href="https://www.auisoft.net/aui.ico" rel="shortcut icon" />

<!-- 데모 구성용 CSS 입니다. 실제 프로젝트에서는 불필요 하니 추가할 필요 없습니다. -->
<link href="./demo.css" rel="stylesheet">

<!-- 데모용 공용 스크립트입니다. 여기에 공통적인 스크립트가 존재합니다. 실제 프로젝트에서는 불필요 하니 추가할 필요 없습니다. -->
<script type="text/javascript" src="./common.js"></script>

<!-- AUIGrid 테마 CSS 파일입니다. 그리드 출력을 위해 꼭 삽입하십시오. -->
<!-- 원하는 테마가 있다면, 다른 파일로 교체 하십시오. -->
<link href="../AUIGrid/AUIGrid_style.css" rel="stylesheet">

<!-- AUIGrid 라이센스 파일입니다. 그리드 출력을 위해 꼭 삽입하십시오. -->
<script type="text/javascript" src="../AUIGrid/AUIGridLicense.js"></script>

<!-- AUIGrid 컴포넌트 JS 파일입니다. 그리드 출력을 위해 꼭 삽입하십시오.--> 
<script type="text/javascript" src="../AUIGrid/AUIGrid.js"></script>


<style>
	/* 커스텀 스타일 */
	.left {
		text-align: left;
	}

	.c-red {
		color: #CC3D3D;
		font-weight: bold;
	}
</style>
<script>
    // 이 예제: 트리 데이터를 필터링해도 부모와 자식 관계를 유지합니다. 트리 칼럼의 필터에서 일반 목록과 계층 목록을 비교하세요.
    // init에서 그리드를 생성합니다. 칼럼 정의, 설정, 데이터 입력과 버튼 동작은 이 페이지에 있습니다.
    // AUIGrid 생성 후 반환 ID
    let myGridID;
    // 시작점
    function init() {
        // AUIGrid 그리드를 생성합니다.
        createAUIGrid();
        // 데이터 요청, 요청 성공 시 AUIGrid 에 데이터 삽입합니다.
        loadGridData();
    }
    // AUIGrid 를 생성합니다.
    function createAUIGrid() {
        // 그리드 칼럼 레이아웃 설정
        const columnLayout = [
            {
                dataField: "id",
                headerText: "ID",
                width: 120
            }, {
                dataField: "name",
                headerText: "Task Name",
                filter: {
                    showIcon: true,
                    useExMenu: true
                },
                style: "left",
                width: 360
            }, {
                dataField: "charge",
                headerText: "Charge",
                filter: {
                    showIcon: true,
                    useExMenu: true
                },
                style: "left",
                width: 160
            }, {
                dataField: "complete",
                headerText: "Complete(%)",
                dataType: "numeric",
                filter: {
                    showIcon: true,
                    useExMenu: true
                },
                postfix: "%",
                width: 140
            }, {
                dataField: "start",
                headerText: "Start Date",
                filter: {
                    showIcon: true
                }
            }, {
                dataField: "end",
                headerText: "End Date",
                filter: {
                    showIcon: true
                }
            }
        ];
        // 그리드 속성 설정
        const gridProps = {
            // singleRow 선택모드
            selectionMode: "multipleRow",
            hoverMode: "singleRow",
            // 적용한 데이터를 그리드가 dataType 에 맞게 처리함.
            processValidData: true,
            // 필터사용
            enableFilter: true,
            useTreeFilterMenu: true,
            // 작업 이름 칼럼에 트리 아이콘과 계층 필터를 함께 표시합니다.
            treeColumnIndex: 1,
            // 사용자가 정의한 데이터 필드 중 id 를 rowIdField 로 설정함
            rowIdField: "id",
            // 최초 보여질 때 모두 열린 상태로 출력 여부
            displayTreeOpen: false,
            editable: true,
            softRemoveRowMode: false,
            // 체크박스 사용 안함
            showRowCheckColumn: false
        };
        // 실제로 #grid_wrap 에 그리드 생성
        myGridID = AUIGrid.create("#grid_wrap", columnLayout, gridProps);
    }
    let isExpanded = false;
    // 모든 트리 항목을 펼치거나 접습니다.
    function expand() {
        if (!isExpanded) {
            AUIGrid.expandAll(myGridID);
            isExpanded = true;
            return;
        }
        AUIGrid.collapseAll(myGridID);
        isExpanded = false;
    }
    // 선택한 깊이까지 트리를 펼쳐 표시합니다.
    function showItemsOnDepth(event) {
        const depthSelect = document.getElementById("depthSelect");
        const depth = depthSelect.value;
        // 해당 depth 까지 오픈함
        AUIGrid.showItemsOnDepth(myGridID, Number(depth));
    }
    // 적용 중인 필터는 유지하고 다음에 여는 메뉴의 표시 방식만 바꿉니다.
    function changeTreeFilterMenu() {
        AUIGrid.setProp(myGridID, 'useTreeFilterMenu', document.getElementById('tree-filter-menu').checked);
    }
    // 여러 데모가 같은 JSON 자료를 사용합니다. 실제 서비스에서는 이 주소를 데이터 API로 바꾸세요.
    // 응답을 받은 뒤 setGridData에 전달하는 과정까지 이 HTML에서 확인할 수 있습니다.
    async function loadGridData() {
        AUIGrid.showAjaxLoader(myGridID);
        try {
            const response = await fetch("./data/schedule_tree.json");
            if (!response.ok)
                throw new Error("데이터를 불러오지 못했습니다.");
            const data = await response.json();
            AUIGrid.setGridData(myGridID, data);
        }
        catch (error) {
            document.getElementById("elapse").textContent = error.message;
        }
        finally {
            AUIGrid.removeAjaxLoader(myGridID);
        }
    }
</script>
</head>
<body>

<div id="main">
	<div class="desc">
		<p>트리 데이터를 필터링해도 부모와 자식 관계를 유지합니다. 트리 칼럼의 필터에서 일반 목록과 계층 목록을 비교하세요.</p>
		<p><code>useTreeFilterMenu: true</code>로 계층 목록을 사용합니다. 필터 적용 전의 접기와 펼치기 상태도 유지합니다.</p>
        <p><label><input id="tree-filter-menu" type="checkbox" checked onchange="changeTreeFilterMenu()">계층 필터 메뉴 사용</label></p>
<ul class="nav_u">
			<li><span onclick="expand()" class="btn">모두 열기/ 닫기</span></li>
			<li><select id="depthSelect" onchange="showItemsOnDepth()">
					<option value="default" selected="selected" disabled="disabled">-- 특정 계층까지만 보이기 -- </option>
					<option value="1">계층 1 Depth 만 보이기</option>
					<option value="2">계층 2 Depth 까지 보이기</option>
					<option value="3">계층 3 Depth 까지 보이기</option>
				</select></li>
		</ul>
	</div>
	<div>
		<!-- 에이유아이 그리드가 이곳에 생성됩니다. -->
		<div id="grid_wrap" style="width:100%;height:480px; margin:0 auto;"></div>
	</div>
	<div class="desc_bottom">
	</div>
        <p id="elapse" role="status"></p>
</div>
<div id="footer">
     <div class="copyright">
        <p>Copyright © AUISoft Co., Ltd. https://www.auisoft.net</p>
    </div>
</div>
</body>
</html>
