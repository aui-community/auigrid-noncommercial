            // 추가한 발전소도 기존 권역의 바로 뒤에 배치하여 세로 병합을 유지합니다.
            sites.sort(
                (a, b) =>
                    ["호남", "영남", "강원", "제주"].indexOf(a.region) -
                    ["호남", "영남", "강원", "제주"].indexOf(b.region)
            );
            let myGridID;
            let rateOnly = false;
            let firstMonth = 4;
            const numberFormat = new Intl.NumberFormat("ko-KR");
            // 월별 목표와 실적은 같은 원천 자료에서 생성하며 화면과 내보내기에 함께 사용합니다.
            function monthly(site, month) {
                const seasonal = [0.78, 0.82, 0.96, 1.05, 1.14, 1.08, 1.03, 1.02, 0.94, 0.86, 0.76, 0.72][month - 1];
                const target = Math.round(site.target * seasonal);
                // 목록 순서가 바뀌어도 기존 발전소의 실적이 달라지지 않도록 고유 번호를 사용합니다.
                const actual = Math.round(
                    target * (site.ratio + (((month + Number(site.id.slice(1)) - 1) % 5) - 2) * 0.035)
                );
                return { target, actual };
            }
            function valueLabel(row, col, value, header, item) {
                return item.metric === "rate" ? Number(value).toFixed(1) : numberFormat.format(value);
            }
            function valueStyle(row, col, value, header, item) {
                if (item.metric === "rate")
                    return value < 95 ? "energy-rate-low" : value < 100 ? "energy-rate-mid" : "energy-rate-high";
                return item.metric === "target" ? "energy-target-row workspace-number" : "workspace-number";
            }
            function reportLayout() {
                const layout = [
                    {
                        dataField: "region",
                        headerText: "권역",
                        width: "5.5%",
                        minWidth: 65,
                        cellMerge: true,
                        style: "energy-region"
                    },
                    {
                        dataField: "name",
                        headerText: "발전소",
                        width: "13%",
                        minWidth: 145,
                        cellMerge: true,
                        mergePolicy: "restrict",
                        mergeRef: "region",
                        style: "energy-site"
                    },
                    {
                        dataField: "label",
                        headerText: "지표 / 단위",
                        width: "10%",
                        minWidth: 110,
                        style: "workspace-left"
                    }
                ];
                // 분기 헤더 아래의 월별 칼럼을 만들고 누계는 비율 합계가 아닌 실적/목표 합계로 계산합니다.
                for (let quarter = 0; quarter < 2; quarter++) {
                    const start = firstMonth + quarter * 3;
                    layout.push({
                        headerText: Math.ceil(start / 3) + "분기",
                        children: Array.from({ length: 3 }, (_, index) => ({
                            dataField: "m" + (start + index),
                            headerText: start + index + "월",
                            width: "10%",
                            minWidth: 78,
                            dataType: "numeric",
                            labelFunction: valueLabel,
                            styleFunction: valueStyle
                        }))
                    });
                }
                layout.push({
                    dataField: "total",
                    headerText: "기간 누계",
                    width: "11.5%",
                    minWidth: 105,
                    dataType: "numeric",
                    style: "energy-cumulative",
                    labelFunction: valueLabel,
                    styleFunction: valueStyle
                });
                return layout;
            }
            function init() {
                myGridID = AUIGrid.create("#grid_wrap", reportLayout(), {
                    rowIdField: "id",
                    rowIdTrustMode: true,
                    showRowNumColumn: false,
                    showStateColumn: false,
                    rowHeight: 28,
                    headerHeight: 28,
                    enableCellMerge: true,
                    cellMergeRowSpan: true,
                    selectionMode: "multipleCells",
                    enableSorting: false
                });
                refreshReport();
            }
            function refreshReport() {
                const region = document.getElementById("energy-region").value,
                    source = document.getElementById("energy-source").value;
                const nextMonth = Number(document.getElementById("energy-period").value);
                if (nextMonth !== firstMonth) {
                    firstMonth = nextMonth;
                    AUIGrid.changeColumnLayout(myGridID, reportLayout());
                }
                const data = [],
                    total = { actual: 0, target: 0 };
                let count = 0;
                sites.forEach((site) => {
                    if ((region !== "전체" && region !== site.region) || (source !== "전체" && source !== site.source))
                        return;
                    count++;
                    const base = { region: site.region, name: site.name, source: site.source, siteId: site.id };
                    const actual = {
                        ...base,
                        id: site.id + "-actual",
                        metric: "actual",
                        label: "발전량 (MWh)",
                        total: 0
                    };
                    const target = {
                        ...base,
                        id: site.id + "-target",
                        metric: "target",
                        label: "목표 (MWh)",
                        total: 0
                    };
                    const rate = { ...base, id: site.id + "-rate", metric: "rate", label: "달성률 (%)" };
                    for (let month = firstMonth; month < firstMonth + 6; month++) {
                        const values = monthly(site, month),
                            field = "m" + month;
                        actual[field] = values.actual;
                        target[field] = values.target;
                        rate[field] = (values.actual / values.target) * 100;
                        actual.total += values.actual;
                        target.total += values.target;
                    }
                    rate.total = (actual.total / target.total) * 100;
                    total.actual += actual.total;
                    total.target += target.total;
                    data.push(...(rateOnly ? [rate] : [actual, target, rate]));
                });
                AUIGrid.setGridData(myGridID, data);
                document.getElementById("energy-total").textContent = numberFormat.format(total.actual) + " MWh";
                document.getElementById("energy-achievement").textContent =
                    "목표 대비 " + (total.target ? (total.actual / total.target) * 100 : 0).toFixed(1) + "%";
                document.getElementById("energy-report-period").textContent =
                    "2026년 " + firstMonth + "월 — " + (firstMonth + 5) + "월 운영 보고서";
                document.getElementById("energy-count").textContent =
                    count + "개 발전소 / " + (rateOnly ? "달성률 비교" : "발전량, 목표, 달성률 비교");
            }
            function setReportView(value) {
                rateOnly = value;
                document
                    .querySelectorAll("[data-report-view]")
                    .forEach((button) =>
                        button.setAttribute("aria-pressed", String((button.dataset.reportView === "rate") === rateOnly))
                    );
                refreshReport();
            }
            function exportReport(format) {
                const props = { fileName: "재생에너지_2026_" + firstMonth + "-" + (firstMonth + 5) };
                if (format === "pdf")
                    AUIGrid.exportToPdf(myGridID, { ...props, fontPath: "../pdfkit/nyjgothic-medium.ttf" });
                else AUIGrid.exportToXlsx(myGridID, props);
            }
            function disposeDemo(event) {
                if (event.persisted) return;
                AUIGrid.destroy(myGridID);
                myGridID = null;
                window.removeEventListener("pagehide", disposeDemo);
            }
            window.addEventListener("pagehide", disposeDemo);
        </script>
