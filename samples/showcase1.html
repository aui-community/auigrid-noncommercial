<!-- 데모용 공용 스크립트입니다. 여기에 공통적인 스크립트가 존재합니다. 실제 프로젝트에서는 불필요 하니 추가할 필요 없습니다. -->
<script type="text/javascript" src="./common.js"></script>

<!-- AUIGrid 테마 CSS 파일입니다. 그리드 출력을 위해 꼭 삽입하십시오. -->
<!-- 원하는 테마가 있다면, 다른 파일로 교체 하십시오. -->
<link href="../AUIGrid/AUIGrid_style.css" rel="stylesheet">

<!-- AUIGrid 라이센스 파일입니다. 그리드 출력을 위해 꼭 삽입하십시오. -->
<script type="text/javascript" src="../AUIGrid/AUIGridLicense.js"></script>

<!-- AUIGrid 컴포넌트 JS 파일입니다. 그리드 출력을 위해 꼭 삽입하십시오.--> 
<script type="text/javascript" src="../AUIGrid/AUIGrid.js"></script>

        <!-- 제품 테마는 유지하고 업무 화면의 조작 도구만 별도로 구성합니다. -->
        <link href="./style/showcase-workspaces.css?v=20261006-3" rel="stylesheet" />
        <script src="../pdfkit/AUIGrid.pdfkit.js"></script>
        <script src="../export_server_samples/FileSaver.min.js"></script>
        <script>
            let myGridID;
            let nextResource = 601;
            const states = ["가동", "예약", "점검", "유휴"];
            const stateClasses = {
                "가동": "resource-active",
                "예약": "resource-reserved",
                "점검": "resource-maintenance",
                "유휴": "resource-idle"
            };
            const sites = ["수도권 센터", "중부 센터", "남부 센터", "동부 센터", "서부 센터"];
            const resourceTypes = [
                "자율이동 로봇",
                "무인 운반차",
                "전동 지게차",
                "3D 프린터",
                "정밀 측정기",
                "비전 검사기"
            ];
            const dayFields = Array.from({ length: 31 }, (_, index) => "d" + (index + 1));
            const numberFormat = new Intl.NumberFormat("ko-KR");
            // 자원마다 다른 연속 가동, 예약 및 점검 구간을 만들며 같은 번호는 항상 같은 일정을 갖습니다.
            function makeResource(index, empty = false) {
                const type = resourceTypes[index % resourceTypes.length],
                    serial = String(index + 1).padStart(4, "0");
                const item = {
                    id: "R" + serial,
                    asset: type + " #" + serial,
                    category: type,
                    site: sites[Math.floor(index / resourceTypes.length) % sites.length]
                };
                dayFields.forEach((field, day) => {
                    const phase = (day + index * 7) % 31;
                    const weekend = [0, 6].includes(new Date(2026, 9, day + 1).getDay());
                    item[field] = empty
                        ? "유휴"
                        : phase < 2
                          ? "점검"
                          : phase < 6
                            ? "예약"
                            : weekend && index % 3 !== 0
                              ? "유휴"
                              : phase > 27
                                ? "유휴"
                                : "가동";
                });
                return item;
            }
            // 출석표처럼 날짜 셀의 상태를 세어 월간 집계와 가동률을 즉시 계산합니다.
            function stateCount(row, col, item, field) {
                const expected = {
                    active: "가동",
                    reserved: "예약",
                    maintenance: "점검",
                    idle: "유휴",
                    utilization: "가동"
                }[field];
                const count = dayFields.reduce((sum, day) => sum + (item[day] === expected ? 1 : 0), 0);
                return field === "utilization" ? count / 31 : count;
            }
            function init() {
                const columns = [
                    {
                        dataField: "asset",
                        headerText: "관리 자원",
                        width: 190,
                        editable: false,
                        style: "workspace-left"
                    },
                    { dataField: "site", headerText: "운영 거점", width: 100, editable: false },
                    {
                        headerText: "월간 집계 (일)",
                        children: [
                            ...[
                                ["active", "가동"],
                                ["reserved", "예약"],
                                ["maintenance", "점검"],
                                ["idle", "유휴"]
                            ].map(([field, label]) => ({
                                dataField: field,
                                headerText: label,
                                width: 48,
                                dataType: "numeric",
                                editable: false,
                                expFunction: stateCount,
                                headerStyle: stateClasses[label]
                            })),
                            {
                                dataField: "utilization",
                                headerText: "가동률",
                                width: 140,
                                dataType: "numeric",
                                editable: false,
                                expFunction: stateCount,
                                // 계산된 0~1 비율을 막대와 백분율 텍스트로 함께 표시합니다.
                                renderer: {
                                    type: "PercentageRenderer",
                                    showBar: true,
                                    showLabel: true,
                                    precision: 0,
                                    offset: 8
                                }
                            }
                        ]
                    }
                ];
                const weekdays = ["일", "월", "화", "수", "목", "금", "토"];
                dayFields.forEach((field, index) => {
                    const day = new Date(2026, 9, index + 1).getDay();
                    columns.push({
                        headerText: weekdays[day],
                        children: [
                            {
                                dataField: field,
                                headerText: String(index + 1),
                                width: 44,
                                headerStyle: day === 0 || day === 6 ? "resource-weekend" : "",
                                styleFunction: (row, col, value) => stateClasses[value],
                                editRenderer: { type: "DropDownListRenderer", list: states }
                            }
                        ]
                    });
                });
                myGridID = AUIGrid.create("#grid_wrap", columns, {
                    rowIdField: "id",
                    rowIdTrustMode: true,
                    editable: true,
                    enableUndoRedo: true,
                    softRemoveRowMode: false,
                    showStateColumn: true,
                    showRowNumColumn: true,
                    rowHeight: 28,
                    headerHeight: 26,
                    showFooter: true,
                    enableFilter: true,
                    selectionMode: "multipleCells",
                    fixedColumnCount: matchMedia("(max-width:760px)").matches ? 0 : 2
                });
                AUIGrid.setFooter(myGridID, [
                    { positionField: "asset", labelText: "조회 자원 일수 합계", colSpan: 2 },
                    ...["active", "reserved", "maintenance", "idle"].map((field) => ({
                        dataField: field,
                        positionField: field,
                        operation: "SUM",
                        formatString: "#,##0"
                    }))
                ]);
                AUIGrid.bind(myGridID, "cellEditEndBefore", (event) =>
                    dayFields.includes(event.dataField) && !states.includes(event.value) ? event.oldValue : event.value
                );
                AUIGrid.bind(myGridID, ["cellEditEnd", "undoRedoChange"], () =>
                    queueMicrotask(() => {
                        if (myGridID) updateResourceCount();
                    })
                );
                AUIGrid.setGridData(
                    myGridID,
                    Array.from({ length: 600 }, (_, index) => makeResource(index))
                );
                updateResourceCount();
                window.addEventListener("resize", syncFixedColumns);
            }
            function updateResourceCount() {
                document.getElementById("resource-count").textContent =
                    numberFormat.format(AUIGrid.getRowCount(myGridID)) +
                    " / " +
                    numberFormat.format(AUIGrid.getOrgGridData(myGridID).length) +
                    "개 자원";
                document.getElementById("resource-undo").disabled = !AUIGrid.undoable(myGridID);
            }
            function filterResources() {
                AUIGrid.forceEditingComplete(myGridID, null);
                const site = document.getElementById("resource-site").value,
                    type = document.getElementById("resource-type").value,
                    query = document.getElementById("resource-search").value.trim().toLowerCase();
                AUIGrid.setFilter(
                    myGridID,
                    "asset",
                    (field, value, item) =>
                        (site === "전체" || item.site === site) &&
                        (type === "전체" || item.category === type) &&
                        (!query || item.asset.toLowerCase().includes(query))
                );
                updateResourceCount();
            }
            function applyState() {
                AUIGrid.forceEditingComplete(myGridID, null);
                const updates = new Map(),
                    value = document.getElementById("resource-state").value;
                // 행 ID별 변경을 모아 한 번에 적용하면 범위 편집도 한 번의 Undo로 취소할 수 있습니다.
                AUIGrid.getSelectedItems(myGridID).forEach((cell) => {
                    if (!dayFields.includes(cell.dataField)) return;
                    if (!updates.has(cell.item.id)) updates.set(cell.item.id, { id: cell.item.id });
                    updates.get(cell.item.id)[cell.dataField] = value;
                });
                if (updates.size) AUIGrid.updateRowsById(myGridID, [...updates.values()]);
                document.getElementById("resource-message").textContent = updates.size
                    ? updates.size + "개 자원의 선택한 날짜를 " + value + " 상태로 변경했습니다."
                    : "먼저 날짜 셀이나 날짜 범위를 선택하세요.";
                updateResourceCount();
            }
            function addResource() {
                AUIGrid.forceEditingComplete(myGridID, null);
                document.getElementById("resource-site").value = "전체";
                document.getElementById("resource-type").value = "전체";
                document.getElementById("resource-search").value = "";
                filterResources();
                AUIGrid.addRow(myGridID, makeResource(nextResource++ - 1, true), "last");
                updateResourceCount();
            }
            function removeResource() {
                AUIGrid.forceEditingComplete(myGridID, null);
                AUIGrid.removeRow(myGridID, "selectedIndex");
                updateResourceCount();
            }
            function undoResource() {
                AUIGrid.forceEditingComplete(myGridID, null);
                AUIGrid.undo(myGridID);
                updateResourceCount();
            }
            // 좁은 화면에서는 고정 열을 풀어 날짜 칼럼에도 충분한 스크롤 영역을 제공합니다.
            function syncFixedColumns() {
                if (myGridID) AUIGrid.setFixedColumnCount(myGridID, matchMedia("(max-width:760px)").matches ? 0 : 2);
            }
            function exportReport(format) {
                AUIGrid.forceEditingComplete(myGridID, null);
                const props = { fileName: "자원운영표_2026_10" };
                if (format === "pdf")
                    AUIGrid.exportToPdf(myGridID, { ...props, fontPath: "../pdfkit/nyjgothic-medium.ttf" });
                else AUIGrid.exportToXlsx(myGridID, props);
            }
            function disposeDemo(event) {
                if (event.persisted) return;
                AUIGrid.destroy(myGridID);
                myGridID = null;
                window.removeEventListener("resize", syncFixedColumns);
                window.removeEventListener("pagehide", disposeDemo);
            }
            window.addEventListener("pagehide", disposeDemo);
        </script>
    </head>
<body class="demo-typography">

            <div id="main" class="workspace-demo resource-planner">
                <div class="workspace-heading">
                    <div>
                        <h2>산업 장비 자원 운영표</h2>
                        <p>600개 장비의 날짜별 가동, 예약과 점검 일정을 한눈에 관리하세요.</p>
                    </div>
                    <strong class="resource-month">2026년 10월</strong>
                </div>
                <div class="workspace-toolbar">
                    <div class="workspace-controls">
                        <label
                            >거점<select id="resource-site" onchange="filterResources()">
                                <option>전체</option>
                                <option>수도권 센터</option>
                                <option>중부 센터</option>
                                <option>남부 센터</option>
                                <option>동부 센터</option>
                                <option>서부 센터</option>
                            </select></label
                        ><label
                            >자원 종류<select id="resource-type" onchange="filterResources()">
                                <option>전체</option>
                                <option>자율이동 로봇</option>
                                <option>무인 운반차</option>
                                <option>전동 지게차</option>
                                <option>3D 프린터</option>
                                <option>정밀 측정기</option>
                                <option>비전 검사기</option>
                            </select></label
                        ><input
                            type="search"
                            id="resource-search"
                            class="workspace-search"
                            placeholder="자원명 또는 번호 검색"
                            aria-label="자원 검색"
                            oninput="filterResources()"
                        />
                    </div>
                    <span id="resource-count"></span>
                </div>
                <div class="resource-legend" aria-label="운영 상태 범례">
                    <span class="resource-active">가동</span><span class="resource-reserved">예약</span
                    ><span class="resource-maintenance">점검</span><span class="resource-idle">유휴</span
                    ><small>날짜를 더블클릭해 상태를 변경하세요. 집계는 자동 계산됩니다.</small>
                </div>
                <div class="workspace-toolbar">
                    <div class="workspace-controls">
                        <select id="resource-state" aria-label="범위에 적용할 상태">
                            <option>가동</option>
                            <option>예약</option>
                            <option>점검</option>
                            <option>유휴</option></select
                        ><button type="button" class="btn" onclick="applyState()">선택 날짜에 적용</button
                        ><button type="button" class="btn" id="resource-undo" onclick="undoResource()">
                            실행 취소
                        </button>
                    </div>
                    <div class="workspace-controls">
                        <button type="button" class="btn" onclick="addResource()">자원 추가</button
                        ><button type="button" class="btn" onclick="removeResource()">선택 삭제</button
                        ><button type="button" class="btn" onclick="exportReport('xlsx')">Excel 내보내기</button
                        ><button type="button" class="btn" onclick="exportReport('pdf')">PDF 내보내기</button>
                    </div>
                </div>
                <div id="grid_wrap"></div>
                <div class="workspace-note">
                    <p id="resource-message" role="status">
                        드래그로 날짜 범위를 선택하면 여러 일정의 상태를 한 번에 변경할 수 있습니다.
                    </p>
                    <p>가상 자원 데이터 / 가동률 = 가동 일수 ÷ 31일</p>
                </div>
            </div>
<div id="footer">
     <div class="copyright">
        <p>Copyright © AUISoft Co., Ltd. https://www.auisoft.net</p>
    </div>
</div>
</body>
