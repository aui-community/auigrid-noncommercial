<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge"/>
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1"> 
<meta name="og:title" content="HTML5, 자바스크립트 데이터그리드 AUIGrid">
<meta name="og:url" content="https://www.auisoft.net/">
<meta name="og:description" content="HTML5, 자바스크립트 데이타그리드(javascript datagrid) AUISoft">
<title>AUIGrid v3.0 샘플- HTML5, 자바스크립트 데이터그리드 AUIGrid</title>
<link href="https://www.auisoft.net/aui.ico" rel="shortcut icon" />

<!-- 데모 구성용 CSS 입니다. 실제 프로젝트에서는 불필요 하니 추가할 필요 없습니다. -->
<link rel="stylesheet" href="./static/prism.css">
<link href="./demo.css" rel="stylesheet">

<!-- Prism.js 1.30.0, Tomorrow / MIT. 표시용 스타일은 제품 CSS와 분리합니다. -->
<link rel="stylesheet" href="./style/demo-typography.css">
<link rel="stylesheet" href="./static/code-examples.css">
<script src="./static/prism.js" data-manual></script>
<script src="./static/code-examples.js" data-source-viewer></script>


<!-- 데모용 공용 스크립트입니다. 여기에 공통적인 스크립트가 존재합니다. 실제 프로젝트에서는 불필요 하니 추가할 필요 없습니다. -->
<script type="text/javascript" src="./common.js"></script>

<!-- AUIGrid 테마 CSS 파일입니다. 그리드 출력을 위해 꼭 삽입하십시오. -->
<!-- 원하는 테마가 있다면, 다른 파일로 교체 하십시오. -->
<link href="../AUIGrid/AUIGrid_style.css" rel="stylesheet">

<!-- AUIGrid 라이센스 파일입니다. 그리드 출력을 위해 꼭 삽입하십시오. -->
<script type="text/javascript" src="../AUIGrid/AUIGridLicense.js"></script>

<!-- AUIGrid 컴포넌트 JS 파일입니다. 그리드 출력을 위해 꼭 삽입하십시오.--> 
<script type="text/javascript" src="../AUIGrid/AUIGrid.js"></script>


        <style>
            /* 기존 사용자 칼럼 스타일처럼 상위 셀과 숫자 정렬만 구별합니다. */
            .my-team {
                background: #edf3ff;
                color: #315da8;
            }
            .my-right {
                text-align: right;
            }
        </style>
        <script>
            let myGridID;
            function init() {
                createAUIGrid();
                // 정적 JSON을 읽어 그리드에 표시합니다.
                requestGridData("./data/band_body_fixed.json");
            }
            // 밴드형에 필요한 기본 설정과 이 페이지에서 비교할 기능만 지정합니다.
            function createAUIGrid() {
                // children으로 상위 칼럼과 하위 칼럼의 계층을 작성합니다.
                const columnLayout = [
                    {
                        dataField: "id",
                        headerText: "ID",
                        width: 70,
                        editable: false
                    },
                    {
                        dataField: "team",
                        headerText: "소속",
                        bodyCell: true,
                        style: "my-team",
                        children: [
                            {
                                dataField: "name",
                                headerText: "이름",
                                width: 130
                            },
                            {
                                dataField: "position",
                                headerText: "직급",
                                bodyCell: true,
                                children: [
                                    {
                                        dataField: "age",
                                        headerText: "나이",
                                        width: 70,
                                        dataType: "numeric"
                                    },
                                    {
                                        dataField: "birth",
                                        headerText: "생년월일",
                                        width: 120,
                                        dataType: "date",
                                        dateInputFormat: "yyyy-mm-dd",
                                        formatString: "yyyy/mm/dd"
                                    }
                                ]
                            }
                        ]
                    },
                    {
                        // 확인은 출력용 상위 셀입니다. 자식 수량과 금액은 아래쪽에 나란히 표시합니다.
                        dataField: "checked",
                        headerText: "확인",
                        bodyCell: true,
                        editable: false,
                        renderer: { type: "CheckBoxEditRenderer" },
                        children: [
                            {
                                dataField: "qty",
                                headerText: "수량",
                                width: 95,
                                dataType: "numeric"
                            },
                            {
                                dataField: "amount",
                                headerText: "금액",
                                width: 120,
                                dataType: "numeric",
                                formatString: "#,##0",
                                style: "my-right"
                            }
                        ]
                    },
                    // 오른쪽 칼럼을 충분히 두어 가로 스크롤 중에도 왼쪽 고정 영역을 비교합니다.
                    { dataField: "note", headerText: "담당 업무", width: 420 },
                    { dataField: "employeeNo", headerText: "사번", width: 110 },
                    { dataField: "email", headerText: "이메일", width: 200 },
                    { dataField: "phone", headerText: "전화번호", width: 140 },
                    { dataField: "office", headerText: "근무지", width: 110 },
                    {
                        dataField: "joinedAt",
                        headerText: "입사일",
                        width: 120,
                        dataType: "date",
                        dateInputFormat: "yyyy-mm-dd",
                        formatString: "yyyy/mm/dd"
                    }
                ];
                const gridProps = {
                    bodyLayoutMode: "band",
                    rowHeight: 120,
                    rowIdField: "id",
                    editable: false,
                    selectionMode: "multipleCells",
                    fixedColumnCount: 4,
                    usePaging: true,
                    pageRowCount: 6
                };
                myGridID = AUIGrid.create("#grid_wrap", columnLayout, gridProps);
            }
        </script>
    </head>
<body class="demo-typography">

            <div id="main">
                <div class="desc">
                    <p>
                        가로로 스크롤해도 ID와 소속 영역은 고정됩니다. 고정 해제, 이름 숨김, 페이지 이동을 비교하세요.
                    </p>
                    <!-- 공통 조작 영역에서 설정과 실행 버튼을 용도별로 묶습니다. -->
                    <div class="demo-options">
                        <div class="demo-option-row">
                            <div class="demo-option-group" role="group" aria-label="고정 칼럼">
                                <span class="demo-option-label">고정 칼럼</span>
                                <button type="button" class="btn" onclick="AUIGrid.setFixedColumnCount(myGridID, 4)">
                                    ID와 소속 전체 고정
                                </button>
                                <button type="button" class="btn" onclick="AUIGrid.setFixedColumnCount(myGridID, 0)">
                                    고정 해제
                                </button>
                            </div>
                            <div class="demo-option-group" role="group" aria-label="칼럼 표시">
                                <span class="demo-option-label">칼럼 표시</span>
                                <button
                                    type="button"
                                    class="btn"
                                    onclick="AUIGrid.hideColumnByDataField(myGridID, 'name')"
                                >
                                    이름 숨기기
                                </button>
                                <button
                                    type="button"
                                    class="btn"
                                    onclick="AUIGrid.showColumnByDataField(myGridID, 'name')"
                                >
                                    이름 보이기
                                </button>
                            </div>
                        </div>
                        <div class="demo-option-row">
                            <span class="demo-option-label">페이지 이동</span>
                            <button type="button" class="btn" onclick="AUIGrid.movePageTo(myGridID, 1)">
                                첫 페이지
                            </button>
                            <button type="button" class="btn" onclick="AUIGrid.movePageTo(myGridID, 2)">
                                2 페이지
                            </button>
                        </div>
                    </div>
                </div>
                <div>
                    <div id="grid_wrap" style="width: 100%; height: 480px; margin: 0 auto"></div>
                </div>
            </div>
<div id="footer">
     <div class="copyright">
        <p>Copyright © AUISoft Co., Ltd. https://www.auisoft.net</p>
    </div>
</div>
</body>
</html>
