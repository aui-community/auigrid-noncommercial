<!-- AUIGrid 라이센스 파일입니다. 그리드 출력을 위해 꼭 삽입하십시오. -->
<script type="text/javascript" src="../AUIGrid/AUIGridLicense.js"></script>

<style>
    /* 커스텀 셀 스타일 정의 */
    .terrible-style {
        color: #000;
        background: #ffd8d8;
    }

    .bad-style {
        color: #000;
        background: #fae0d4;
    }

    .not-bad-style {
        color: #000;
        background: #faf4c0;
    }

    .soso-style {
        color: #000;
        background: #e4f7ba;
    }

    .good-style {
        color: #000;
        background: #cefbc9;
    }

    .best-style {
        color: #000;
        background: #86e57f;
    }
</style>
<script>
    // AUIGrid 생성 후 반환 ID
    let myGridID;

    let timerId;

    // 시작점
    function init() {
        // 칼럼 레이아웃 반환
        const columnLayout = createColumnData();
        // AUIGrid 그리드를 생성합니다.
        createAUIGrid(columnLayout);
        // 데이터 요청, 요청 성공 시 AUIGrid 에 데이터 삽입합니다.
        requestGridData("./data/stress_5000.json");
    }

    // 칼럼 레이아웃을 생성하여 반환합니다.
    function createColumnData() {
        // 칼럼 레이아웃 설정
        const columnLayout = [
            {
                dataField: "dept",
                headerText: "부서코드"
            }
        ];

        for (let i = 1; i <= 100; i++) {
            // 칼럼 100개 + 부서 1 총 101개 생성
            const column = {
                width: 70,
                dataField: "w" + i,
                headerText: i + "주",
                dataType: "numeric",
                styleFunction: cellStyleFunction
            };
            columnLayout.push(column);
        }

        return columnLayout;
    }

    // AUIGrid 를 생성합니다.
    function createAUIGrid(columnLayout) {
        // 그리드 속성 설정
        const gridProps = {
            editable: true,
            rowIdField: "dept",
            fixedColumnCount: 1,
            // 휠로 반응하는 행수 5 늘림
            wheelSensitivity: 5
        };

        // 실제로 #grid_wrap 에 그리드 생성
        myGridID = AUIGrid.create("#grid_wrap", columnLayout, gridProps);
    }

    // 셀스타일 함수 정의
    function cellStyleFunction(rowIndex, columnIndex, value, headerText, item, dataField) {
        if (value <= 15) return "terrible-style";
        else if (value <= 30) return "bad-style";
        else if (value <= 45) return "not-bad-style";
        else if (value <= 60) return "soso-style";
        else if (value <= 75) return "good-style";
        return "best-style";
    }

    // 윈도우 리사이징 이벤트
    window.onresize = function () {
        // 200ms 보다 빠르게 리사이징 된다면..
        if (timerId !== null) {
            clearTimeout(timerId);
        }
        timerId = setTimeout(function () {
            // 그리드 리사이징
            if (myGridID) {
                AUIGrid.resize(myGridID);
            }
        }, 200); // 현재 200ms 민감도....환경에 맞게 조절하세요.
    };
</script>
