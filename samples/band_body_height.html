<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Script-Type" content="text/javascript">
<meta http-equiv="Content-Style-Type" content="text/css">
<meta http-equiv="X-UA-Compatible" content="IE=edge"/>
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1"> 
<meta name="og:title" content="HTML5, 자바스크립트 데이터그리드 AUIGrid">
<meta name="og:url" content="https://www.auisoft.net/">
<meta name="og:description" content="HTML5, 자바스크립트 데이타그리드(javascript datagrid) AUISoft">
<title>AUIGrid v3.0 샘플- HTML5, 자바스크립트 데이터그리드 AUIGrid</title>
<link href="https://www.auisoft.net/aui.ico" rel="shortcut icon" />

<!-- 데모 구성용 CSS 입니다. 실제 프로젝트에서는 불필요 하니 추가할 필요 없습니다. -->
<link href="./demo.css" rel="stylesheet">

<!-- 데모용 공용 스크립트입니다. 여기에 공통적인 스크립트가 존재합니다. 실제 프로젝트에서는 불필요 하니 추가할 필요 없습니다. -->
<script type="text/javascript" src="./common.js"></script>

<!-- AUIGrid 테마 CSS 파일입니다. 그리드 출력을 위해 꼭 삽입하십시오. -->
<!-- 원하는 테마가 있다면, 다른 파일로 교체 하십시오. -->
<link href="../AUIGrid/AUIGrid_style.css" rel="stylesheet">

<!-- AUIGrid 라이센스 파일입니다. 그리드 출력을 위해 꼭 삽입하십시오. -->
<script type="text/javascript" src="../AUIGrid/AUIGridLicense.js"></script>

<!-- AUIGrid 컴포넌트 JS 파일입니다. 그리드 출력을 위해 꼭 삽입하십시오.--> 
<script type="text/javascript" src="../AUIGrid/AUIGrid.js"></script>


<style>
    /* 기존 사용자 칼럼 스타일처럼 상위 셀과 숫자 정렬만 구별합니다. */
    .my-team {
        background: #edf3ff;
        color: #315da8;
    }

    .my-right {
        text-align: right;
    }
</style>
<script>
    let myGridID;
    function init() {
        createAUIGrid();
        // 정적 JSON을 읽어 그리드에 표시합니다.
        requestGridData("./data/band_body.json");
    }
    // 처음 생성할 때와 높이를 바꿀 때 같은 값을 사용합니다. 숫자는 px, 문자열은 비율입니다.
    function getBodyCellHeights() {
        const heightType = document.getElementById("height_type").value;
        if (heightType === "px") {
            return { team: 24, position: 28 };
        }
        if (heightType === "percent") {
            return { team: "30%", position: "25%" };
        }
        return {};
    }
    // 밴드형에 필요한 기본 설정과 이 페이지에서 비교할 기능만 지정합니다.
    function createAUIGrid() {
        // children으로 상위 칼럼과 하위 칼럼의 계층을 작성합니다.
        const columnLayout = [
            {
                dataField: "id",
                headerText: "ID",
                width: 70,
                editable: false
            },
            {
                dataField: "team",
                headerText: "소속",
                bodyCell: true,
                style: "my-team",
                children: [
                    {
                        dataField: "name",
                        headerText: "이름",
                        width: 130,
                    },
                    {
                        dataField: "position",
                        headerText: "직급",
                        bodyCell: true,
                        children: [
                            {
                                dataField: "age",
                                headerText: "나이",
                                width: 70,
                                dataType: "numeric",
                            },
                            {
                                dataField: "birth",
                                headerText: "생년월일",
                                width: 120,
                                dataType: "date",
                                dateInputFormat: "yyyy-mm-dd",
                                formatString: "yyyy/mm/dd"
                            }
                        ]
                    }
                ]
            },
            {
                // 확인은 출력용 상위 셀입니다. 자식 수량과 금액은 아래쪽에 나란히 표시합니다.
                dataField: "checked",
                headerText: "확인",
                bodyCell: true,
                bodyCellHeight: "50%",
                editable: false,
                renderer: { type: "CheckBoxEditRenderer" },
                children: [
                    {
                        dataField: "qty",
                        headerText: "수량",
                        width: 95,
                        dataType: "numeric"
                    },
                    {
                        dataField: "amount",
                        headerText: "금액",
                        width: 120,
                        dataType: "numeric",
                        formatString: "#,##0",
                        style: "my-right"
                    }
                ]
            }
        ];
        // 기본값에서는 bodyCellHeight를 작성하지 않습니다. 필요한 경우에만 높이를 추가합니다.
        const heights = getBodyCellHeights();
        if (heights.team !== undefined) {
            columnLayout[1].bodyCellHeight = heights.team;
            columnLayout[1].children[1].bodyCellHeight = heights.position;
        }
        const gridProps = {
            bodyLayoutMode: "band",
            rowHeight: 120,
            rowIdField: "id",
            editable: false,
            selectionMode: "multipleCells",
        };
        myGridID = AUIGrid.create("#grid_wrap", columnLayout, gridProps);
    }
    // 기존 칼럼과 데이터를 유지하고 상위 바디 셀의 표시 여부와 높이만 변경합니다.
    function changeBodyLayout() {
        // 화면의 입력값을 먼저 읽고 칼럼 속성에 전달합니다.
        const showTeam = document.getElementById("show_team").checked;
        const heights = getBodyCellHeights();
        // 기본 균등을 선택하면 undefined로 이전 높이 지정을 해제합니다.
        AUIGrid.setColumnPropByDataField(myGridID, "team", {
            bodyCell: showTeam,
            bodyCellHeight: heights.team
        });
        AUIGrid.setColumnPropByDataField(myGridID, "position", {
            bodyCellHeight: heights.position
        });
        // 변경된 높이와 표시 여부에 맞춰 셀 배치를 다시 계산합니다.
        AUIGrid.refresh(myGridID);
    }
</script>
</head>
<body>

<div id="main">
    <div class="desc">
        <p><code>bodyCellHeight</code>를 생략하면 행 높이를 셀의 세로 단계에 맞춰 나눕니다. 필요한 상위 셀(branch)에만 픽셀 숫자나 <code>"25%"</code> 같은 비율을 지정하세요.</p>
        <p>한 행의 높이는 120px입니다. 소속과 직급의 높이를 바꿔 남은 공간에 하위 셀이 채워지는 모습을 비교하세요.</p>
        <p><label for="height_type">높이 배분 </label><select id="height_type" onchange="changeBodyLayout()">
                <option value="auto">기본 균등 (높이 생략)</option>
                <option value="px">소속 24px / 직급 28px</option>
                <option value="percent">소속 30% / 직급 25%</option>
            </select>
            <label><input id="show_team" type="checkbox" checked onchange="changeBodyLayout()">소속 bodyCell 표시</label>
        </p>
    </div>
    <div>
        <div id="grid_wrap" style="width:100%;height:480px;margin:0 auto;"></div>
    </div>
</div>
<div id="footer">
     <div class="copyright">
        <p>Copyright © AUISoft Co., Ltd. https://www.auisoft.net</p>
    </div>
</div>
</body>
</html>
